id: run-02-healthchecks
title: Implement Container Healthchecks
domain: Container Lifecycle & Resources
difficulty: Medium
weight: 6
hints:
  - "Docker allows configuring healthchecks via CLI options: `--health-cmd`, `--health-interval`, `--health-retries`, `--health-timeout`, and `--health-start-period`."
  - "For an alpine/nginx container, test command can be: `wget --no-verbose --tries=1 --spider http://127.0.0.1/ || exit 1` or `curl -f http://127.0.0.1/ || exit 1`."
  - "Run container named `monitored-web` using `nginx:alpine`."
