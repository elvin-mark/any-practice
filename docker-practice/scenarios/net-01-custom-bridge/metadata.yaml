id: net-01-custom-bridge
title: User-Defined Bridge Network & DNS Discovery
domain: Networking & Service Discovery
difficulty: Easy
weight: 5
hints:
  - "Default bridge network does NOT provide automatic DNS resolution between container names; only user-defined bridge networks provide this!"
  - "Create network: `docker network create --subnet 172.28.0.0/16 --label practice=docker custom-bridge`."
  - "Run server: `docker run -d --name api-server --network custom-bridge --label practice=docker nginx:alpine`."
  - "Run client: `docker run -d --name client-app --network custom-bridge --label practice=docker alpine:3.20 sleep 3600`."
