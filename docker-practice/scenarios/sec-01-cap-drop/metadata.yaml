id: sec-01-cap-drop
title: Least Privilege - Linux Capability Dropping
domain: Container Security & Hardening
difficulty: Medium
weight: 7
hints:
  - "By default, Docker grants a container ~14 powerful Linux capabilities (like CHOWN, SETUID, KILL, NET_RAW)."
  - "To enforce least privilege, drop all capabilities: `--cap-drop=ALL`."
  - "Add back only what is necessary, for example: `--cap-add=NET_BIND_SERVICE`."
  - "Run container named `least-priv-web` using `nginx:alpine`."
