id: workloads-01-multi-container
title: Deploy a Multi-Container Pod with Shared Volume
domain: Workloads & Scheduling
difficulty: Easy
weight: 3
targetContext: kind-cka-cluster-1
targetNamespace: default
hints:
  - "Define an `emptyDir: {}` volume under `spec.volumes`."
