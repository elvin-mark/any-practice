id: join-01-unpurchased-products
title: "Identify Never-Ordered Products (Anti-Join)"
category: Joins
difficulty: Easy
description: |
  Inventory management wants to clear out dead stock.
  Identify all catalog products that have never appeared in any customer order.
goal: |
  Write a query returning:
    - id
    - name
    - price
  For all products with ZERO sales in 'order_items'.
  Order results by 'id' ASCENDING.
hints:
  - "Use a LEFT JOIN between 'products' and 'order_items' on 'products.id = order_items.product_id'"
  - "Add a WHERE clause filtering for 'order_items.product_id IS NULL'"
  - "Alternatively, use 'WHERE id NOT IN (SELECT product_id FROM order_items)'"
setup: |
  CREATE TABLE products (
    id INTEGER PRIMARY KEY,
    name TEXT NOT NULL,
    price REAL NOT NULL
  );

  CREATE TABLE order_items (
    order_id INTEGER NOT NULL,
    product_id INTEGER NOT NULL,
    quantity INTEGER NOT NULL
  );

  INSERT INTO products VALUES
    (1, 'Ergonomic Keyboard', 120.00),
    (2, 'Wireless Mouse', 45.00),
    (3, 'USB-C Monitor Hub', 85.00),
    (4, 'Noise-Cancelling Headset', 199.00),
    (5, 'Vintage Desk Lamp', 65.00);

  INSERT INTO order_items VALUES
    (101, 1, 1),
    (102, 2, 2),
    (103, 1, 1),
    (104, 4, 1);
solution: |
  SELECT p.id, p.name, p.price
  FROM products p
  LEFT JOIN order_items oi ON p.id = oi.product_id
  WHERE oi.product_id IS NULL
  ORDER BY p.id ASC;
