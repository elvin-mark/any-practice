id: query-01-top-customers
title: "Top 3 VIP Customers by Spending"
category: Queries
difficulty: Easy
description: |
  The marketing team wants to launch a loyalty campaign targeting high-value customers.
  You have access to 'customers' (id, name, email) and 'orders' (id, customer_id, amount).
goal: |
  Write a query returning:
    - customer_id
    - name
    - total_spent (the sum of all order amounts for that customer)
  For the top 3 customers, ordered by total_spent DESCENDING.
hints:
  - "Join 'customers' with 'orders' on 'customers.id = orders.customer_id'"
  - "Use 'GROUP BY customers.id, customers.name'"
  - "Order by 'SUM(orders.amount) DESC' and apply 'LIMIT 3'"
setup: |
  CREATE TABLE customers (
    id INTEGER PRIMARY KEY,
    name TEXT NOT NULL,
    email TEXT NOT NULL
  );

  CREATE TABLE orders (
    id INTEGER PRIMARY KEY,
    customer_id INTEGER NOT NULL,
    amount REAL NOT NULL,
    FOREIGN KEY(customer_id) REFERENCES customers(id)
  );

  INSERT INTO customers VALUES
    (1, 'Alice Smith', 'alice@example.com'),
    (2, 'Bob Jones', 'bob@example.com'),
    (3, 'Charlie Brown', 'charlie@example.com'),
    (4, 'Diana Prince', 'diana@example.com'),
    (5, 'Evan Wright', 'evan@example.com');

  INSERT INTO orders VALUES
    (101, 1, 150.00),
    (102, 1, 350.00),
    (103, 2, 75.00),
    (104, 3, 500.00),
    (105, 3, 400.00),
    (106, 4, 1200.00),
    (107, 5, 20.00),
    (108, 5, 45.00);
solution: |
  SELECT c.id AS customer_id, c.name, SUM(o.amount) AS total_spent
  FROM customers c
  JOIN orders o ON c.id = o.customer_id
  GROUP BY c.id, c.name
  ORDER BY total_spent DESC
  LIMIT 3;
