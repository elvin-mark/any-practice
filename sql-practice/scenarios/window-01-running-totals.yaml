id: window-01-running-totals
title: "Cumulative Daily Revenue (Running Total)"
category: Window Functions
difficulty: Medium
description: |
  Finance requires a daily revenue timeline showing both each day's earnings
  and the cumulative running total up to that date.
goal: |
  Write a query returning:
    - order_date
    - revenue
    - running_total (cumulative sum of revenue from the beginning of time up to the current date)
  Ordered by 'order_date' ASCENDING.
hints:
  - "Use the window function 'SUM(revenue) OVER (...)'"
  - "Specify 'ORDER BY order_date ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW'"
  - "In SQLite, 'SUM(revenue) OVER (ORDER BY order_date)' defaults to range unbounded preceding"
setup: |
  CREATE TABLE daily_sales (
    order_date TEXT PRIMARY KEY,
    revenue REAL NOT NULL
  );

  INSERT INTO daily_sales VALUES
    ('2026-01-01', 1200.00),
    ('2026-01-02', 1850.50),
    ('2026-01-03', 950.00),
    ('2026-01-04', 2100.00),
    ('2026-01-05', 1400.25),
    ('2026-01-06', 3200.00);
solution: |
  SELECT order_date, revenue,
         SUM(revenue) OVER (ORDER BY order_date ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS running_total
  FROM daily_sales
  ORDER BY order_date ASC;
