id: pcap-01-tcp-handshake
title: "Extract Leaked Auth Token from Traffic Dump"
category: Packet Analysis
difficulty: Medium
description: |
  A network intrusion detection sensor logged plain-text HTTP traffic to 'http_traffic.log'.
  An unauthorized request sent an authentication bearer token in the HTTP headers.
goal: |
  Inspect the packet trace 'http_traffic.log' and extract the raw Bearer token string
  (without the "Bearer " prefix). Save only the token string into 'token.txt'.
hints:
  - "Inspect 'http_traffic.log' using grep or awk: grep -i 'Authorization: Bearer' http_traffic.log"
  - "Save only the token string into 'token.txt'"
setup: |
  cat << 'EOF' > http_traffic.log
  POST /api/v1/auth/session HTTP/1.1
  Host: internal-auth.corp
  User-Agent: curl/8.5.0
  Accept: */*
  Content-Type: application/json
  Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.s3cr3t_p4ck3t_t0k3n_99
  Content-Length: 18

  {"action":"grant"}

  HTTP/1.1 200 OK
  Date: Fri, 13 Nov 2026 00:00:00 GMT
  Content-Type: application/json
  Content-Length: 15

  {"status":"ok"}
  EOF
verify: |
  set -e
  if [ ! -f token.txt ]; then
    echo "token.txt not found"
    exit 1
  fi

  EXPECTED="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.s3cr3t_p4ck3t_t0k3n_99"
  SUBMITTED=$(cat token.txt | tr -d '[:space:]')

  if [ "$SUBMITTED" != "$EXPECTED" ]; then
    echo "Token mismatch. Got '$SUBMITTED', expected '$EXPECTED'"
    exit 1
  fi
